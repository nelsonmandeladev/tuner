[package]
name = "tuner"
version = "0.1.0"
description = "IPTV player for your own Xtream Codes subscription"
authors = ["MEASDEV"]
edition = "2024"
license = "MIT"
repository = "https://github.com/nelsonmandeladev/tuner"
homepage = "https://github.com/nelsonmandeladev/tuner"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tuner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-libmpv = "0.3.2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
keyring = "4.2.0"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
