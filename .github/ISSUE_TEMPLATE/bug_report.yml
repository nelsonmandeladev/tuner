name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never post your server address, username, password, stream URLs or channel names.** Issues are public. Describe the problem without them (for example "a French news channel" instead of its name).

        Tuner is a player for your own subscription. It cannot help find channels or providers, and requests for them will be closed.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Live TV
        2. Pick a channel
        3. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tuner version
      description: Settings shows it, or the installer's file name.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connecting / sync
        - Live TV
        - Movies / Series
        - Player
        - Search / Home
        - Settings / accounts
        - Install / uninstall
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Check screenshots for account names, addresses and channel lists before attaching them.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This issue contains no server address, username, password, stream URL or channel list.
          required: true
