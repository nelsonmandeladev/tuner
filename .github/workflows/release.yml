# Builds the Windows installer when a version tag is pushed and attaches it
# to a draft GitHub release. Review the draft, then publish it by hand.
#
#   1. Set the version in apps/desktop/src-tauri/tauri.conf.json (and the
#      package.json files), date its CHANGELOG.md section, commit.
#   2. git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $version in tauri.conf.json"
          }
          # The version's CHANGELOG.md section, dated, becomes the release notes.
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\] - (\d{4}-\d{2}-\d{2})\s*\n(.*?)(?=^## \[|^\[[^\]]+\]: )")
          if (-not $section.Success -or -not $section.Groups[2].Value.Trim()) {
            throw "CHANGELOG.md needs a dated entry: ## [$version] - YYYY-MM-DD"
          }
          $section.Groups[2].Value.Trim() | Out-File -Encoding utf8 changes.md
          "VERSION=$version" >> $env:GITHUB_ENV

      - run: pnpm test
      - run: pnpm fetch:libmpv
      - run: pnpm tauri build --bundles nsis

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "Tuner_${env:VERSION}_x64-setup.exe"
          $setup = "apps/desktop/src-tauri/target/release/bundle/nsis/$name"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "$setup.sha256"
          $notes = @"
          ## Install

          Download **$name** below and run it. It installs for your user only, no administrator rights needed.

          Windows may say "Windows protected your PC" because the installer is not code-signed yet: choose **More info**, then **Run anyway**.

          SHA-256: ``$hash``

          ## What's new

          "@
          $notes += "`n`n" + (Get-Content changes.md -Raw)
          gh release create $env:GITHUB_REF_NAME $setup "$setup.sha256" `
            --draft --verify-tag --title "Tuner $env:VERSION" --notes $notes
