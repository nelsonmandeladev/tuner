<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live TV</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0A0B0C}
a{color:#F2A93B;text-decoration:none}a:hover{color:#FFD08A}
button,input{font:inherit;cursor:pointer}
input::placeholder{color:#6E7471}
</style>
</helmet>
<div style="width: 100%; min-height: 900px; background: #0A0B0C; color: #F1F3F2; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap; box-sizing: border-box;">

  <nav aria-label="Main" style="flex: 1 1 220px; max-width: 248px; min-height: 900px; box-sizing: border-box; padding: 28px 16px 20px; border-right: 1px solid #1C1F23; display: flex; flex-direction: column; gap: 28px; background: #0D0F11;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 10px;">
      <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true"><rect x="0" y="8" width="6" height="14" rx="3" fill="#F1F3F2"></rect><rect x="10" y="4" width="6" height="18" rx="3" fill="#F1F3F2"></rect><rect x="20" y="0" width="6" height="22" rx="3" fill="#F2A93B"></rect></svg>
      <span style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.03em;">Tuner</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #9AA09D; font-size: 15px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
      <a href="LiveTV.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; background: #1A1D21; color: #F1F3F2; font-size: 15px; font-weight: 600;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="13" rx="2.5"></rect><path d="m8 2.5 4 3.5 4-3.5"></path></svg>Live TV</a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #9AA09D; font-size: 15px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2.5"></rect><path d="M7 3v18M17 3v18M3 8h4M3 16h4M17 8h4M17 16h4"></path></svg>Movies</a>
      <a href="Series.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #9AA09D; font-size: 15px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="14" rx="2.5"></rect><path d="M6 3.5h12"></path></svg>Series</a>
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: #9AA09D; font-size: 15px; font-weight: 500;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search<span style="margin-left: auto; font-family: 'Geist Mono', monospace; font-size: 12px; color: #7C827F; border: 1px solid #2A2E33; border-radius: 6px; padding: 2px 6px;">⌘K</span></a>
    </div>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 4px;">
      <button type="button" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid #1F2327; background: #121417; color: #F1F3F2; text-align: left;">
        <span style="width: 32px; height: 32px; border-radius: 10px; background: #2A2418; color: #F2A93B; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px;">M</span>
        <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;"><span style="font-size: 14px; font-weight: 600;">Main subscription</span><span style="font-size: 12px; color: #9AA09D;">Xtream · Connected</span></span>
      </button>
    </div>
  </nav>

  <div style="flex: 999 1 600px; min-width: 0; display: flex; flex-wrap: wrap; box-sizing: border-box;">

    <section aria-label="Categories" style="flex: 1 1 200px; max-width: 232px; box-sizing: border-box; padding: 28px 12px; border-right: 1px solid #1C1F23; display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 12px; padding: 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8A908D;">Categories</h2>
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
        <button type="button" onClick="{{c.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: {{c.weight}}; text-align: left;"><span>{{c.name}}</span><span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #7C827F;">{{c.count}}</span></button>
      </sc-for>
    </section>

    <section aria-label="Channels" style="flex: 1 1 380px; min-width: 0; box-sizing: border-box; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <label for="filter" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Filter channels</label>
        <input id="filter" type="search" placeholder="Filter {{catName}}" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 16px; border-radius: 12px; border: 1px solid #23272B; background: #121417; color: #F1F3F2; font-size: 14px;">
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <sc-for list="{{channels}}" as="ch" hint-placeholder-count="9">
          <button type="button" onClick="{{ch.pick}}" style="display: flex; align-items: center; gap: 14px; padding: 10px 12px; border-radius: 14px; border: 1px solid {{ch.ring}}; background: {{ch.bg}}; color: #F1F3F2; text-align: left;">
            <span style="width: 32px; flex: none; font-family: 'Geist Mono', monospace; font-size: 13px; color: #7C827F;">{{ch.num}}</span>
            <span style="width: 40px; height: 40px; flex: none; border-radius: 12px; background: {{ch.tint}}; display: flex; align-items: center; justify-content: center; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 12px; letter-spacing: -0.02em;">{{ch.mono}}</span>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px;">
              <span style="display: flex; align-items: center; gap: 8px;"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ch.name}}</span><sc-if value="{{ch.archive}}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 600; color: #C6CBC8; border: 1px solid #2E3338; border-radius: 6px; padding: 1px 6px;">Catch-up</span></sc-if></span>
              <span style="font-size: 13px; color: #9AA09D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ch.now}}</span>
              <span style="height: 3px; border-radius: 3px; background: #23272B; max-width: 220px;"><span style="display: block; width: {{ch.pct}}; height: 3px; border-radius: 3px; background: #8A908D;"></span></span>
            </span>
            <span style="flex: none; font-family: 'Geist Mono', monospace; font-size: 12px; color: #7C827F;">{{ch.left}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section aria-label="Preview" style="flex: 1 1 400px; max-width: 460px; min-width: 0; box-sizing: border-box; padding: 24px 28px 24px 8px; display: flex; flex-direction: column; gap: 20px;">
      <div style="position: relative; aspect-ratio: 16 / 9; max-width: 100%; border-radius: 18px; overflow: hidden; background: {{sel.tint}};">
        <div style="position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; right: -18%; top: -40%; background: rgba(241,243,242,0.08);"></div>
        <div style="position: absolute; width: 40%; aspect-ratio: 1; border-radius: 50%; left: 8%; bottom: -30%; background: rgba(10,11,12,0.25);"></div>
        <span style="position: absolute; left: 14px; top: 14px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 8px; background: rgba(10,11,12,0.7); font-size: 12px; font-weight: 600;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #F0503C;"></span>LIVE</span>
        <span style="position: absolute; right: 14px; top: 14px; height: 26px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; background: rgba(10,11,12,0.7); font-size: 12px; color: #C6CBC8;">Preview · muted</span>
        <span style="position: absolute; left: 16px; bottom: 14px; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 28px; letter-spacing: -0.04em; color: rgba(241,243,242,0.9);">{{sel.mono}}</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px;">
        <span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #8A908D;">{{sel.num}} · {{sel.name}}</span>
        <h1 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2;">{{sel.now}}</h1>
        <div style="display: flex; align-items: center; gap: 12px; margin-top: 6px;">
          <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9AA09D;">{{sel.start}}</span>
          <div style="flex: 1; height: 4px; border-radius: 4px; background: #23272B;"><div style="width: {{sel.pct}}; height: 4px; border-radius: 4px; background: #F2A93B;"></div></div>
          <span style="font-family: 'Geist Mono', monospace; font-size: 12px; color: #9AA09D;">{{sel.end}}</span>
        </div>
      </div>

      <div style="display: flex; gap: 10px;">
        <a href="Player.dc.html" style="flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 48px; border-radius: 14px; background: #F2A93B; color: #1A1204; font-weight: 600; font-size: 15px;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"></path></svg>Watch</a>
        <button type="button" aria-label="Add to favorites" style="width: 48px; height: 48px; border-radius: 14px; border: 1px solid #2A2E33; background: #121417; color: #F1F3F2; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-8-4.6-8-10.6A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.9c0 6-8 10.6-8 10.6z"></path></svg></button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #1C1F23; padding-top: 16px;">
        <h2 style="margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8A908D;">Up next</h2>
        <sc-for list="{{sel.next}}" as="p" hint-placeholder-count="3">
          <div style="display: flex; gap: 16px; padding: 8px 0; font-size: 14px;"><span style="width: 44px; flex: none; font-family: 'Geist Mono', monospace; font-size: 13px; color: #8A908D;">{{p.t}}</span><span style="color: #C6CBC8;">{{p.title}}</span></div>
        </sc-for>
      </div>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'sport', ch: '301' };
  }
  renderVals() {
    const catList = [
      { id: 'fav', name: 'Favorites', count: '12' },
      { id: 'all', name: 'All channels', count: '1,248' },
      { id: 'cm', name: 'Cameroon', count: '38' },
      { id: 'sport', name: 'Sport', count: '146' },
      { id: 'news', name: 'News', count: '64' },
      { id: 'fr', name: 'France', count: '212' },
      { id: 'movies', name: 'Movies', count: '98' },
      { id: 'kids', name: 'Kids', count: '41' },
      { id: 'docs', name: 'Documentary', count: '57' }
    ];
    const all = [
      { num: '301', mono: 'SP1', name: 'Sport 1 HD', now: 'Premier League · Arsenal v Chelsea', pct: '58%', left: '38m', tint: '#1E4234', archive: true, start: '17:30', end: '19:30', next: [{ t: '19:30', title: 'Match of the Day' }, { t: '20:45', title: 'Serie A · Napoli v Roma' }, { t: '22:45', title: 'Sport 1 Night' }] },
      { num: '302', mono: 'SP2', name: 'Sport 2 HD', now: 'LaLiga · Sevilla v Valencia', pct: '20%', left: '1h 32m', tint: '#22383F', archive: true, start: '18:30', end: '20:30', next: [{ t: '20:30', title: 'LaLiga Highlights' }, { t: '21:00', title: 'LaLiga · Real Betis v Getafe' }, { t: '23:00', title: 'Goals Tonight' }] },
      { num: '303', mono: 'SP3', name: 'Sport 3 HD', now: 'NBA Classics', pct: '74%', left: '16m', tint: '#3F2A1E', archive: false, start: '18:00', end: '19:00', next: [{ t: '19:00', title: 'Inside the Paint' }, { t: '20:00', title: 'NBA Classics' }, { t: '22:00', title: 'Fight Night' }] },
      { num: '305', mono: 'AFR', name: 'Afro Sport', now: 'CAF Champions League · Preview', pct: '35%', left: '39m', tint: '#3D3418', archive: true, start: '18:30', end: '19:30', next: [{ t: '19:30', title: 'Elite One · Coton Sport v Canon' }, { t: '21:30', title: 'Afro Sport Night' }, { t: '22:30', title: 'Replay' }] },
      { num: '310', mono: 'TEN', name: 'Tennis Channel', now: 'ATP 500 · Quarter-final', pct: '50%', left: '1h 05m', tint: '#2E3B1C', archive: false, start: '17:00', end: '20:00', next: [{ t: '20:00', title: 'Tennis Tonight' }, { t: '21:00', title: 'WTA Highlights' }, { t: '22:00', title: 'Grand Slam Stories' }] },
      { num: '312', mono: 'F1', name: 'Motor Racing HD', now: 'Grand Prix · Race replay', pct: '12%', left: '1h 48m', tint: '#40201F', archive: true, start: '18:45', end: '20:45', next: [{ t: '20:45', title: 'Paddock Talk' }, { t: '21:30', title: 'Rally Review' }, { t: '22:30', title: 'Classic Races' }] },
      { num: '318', mono: 'FGT', name: 'Fight Zone', now: 'Boxing · Undercard', pct: '66%', left: '27m', tint: '#2B2440', archive: false, start: '18:00', end: '19:20', next: [{ t: '19:20', title: 'Main Event · Live' }, { t: '21:30', title: 'Post-fight Show' }, { t: '22:00', title: 'Knockouts' }] },
      { num: '320', mono: 'GOL', name: 'Golf HD', now: 'Final Round · Back Nine', pct: '81%', left: '22m', tint: '#1F3A2A', archive: false, start: '16:00', end: '19:15', next: [{ t: '19:15', title: 'Golf Central' }, { t: '20:00', title: 'Course Stories' }, { t: '21:00', title: 'Final Round Replay' }] }
    ];
    const cat = catList.find((c) => c.id === this.state.cat) || catList[3];
    const sel = all.find((c) => c.num === this.state.ch) || all[0];
    return {
      catName: cat.name,
      cats: catList.map((c) => {
        const on = c.id === this.state.cat;
        return { ...c, bg: on ? '#1A1D21' : 'transparent', fg: on ? '#F1F3F2' : '#9AA09D', weight: on ? '600' : '500', pick: () => this.setState({ cat: c.id }) };
      }),
      channels: all.map((c) => {
        const on = c.num === sel.num;
        return { ...c, bg: on ? '#171A1E' : 'transparent', ring: on ? '#2E3338' : 'transparent', pick: () => this.setState({ ch: c.num }) };
      }),
      sel: sel
    };
  }
}
</script>
</body>
</html>
